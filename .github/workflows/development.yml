name: Build Hynis + custom gl4metal

on:
  push:
    branches-ignore: ['l10n_main']
  pull_request:
    branches-ignore: ['l10n_main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Hynis
        uses: actions/checkout@v5

      - name: Read pinned gl4metal version
        id: renderer
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('patches/gl4metal/manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + manifest['repository'] + '\n')
              output.write('ref=' + manifest['base_commit'] + '\n')
          PY

      - name: Checkout pinned gl4metal and its dependencies
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.renderer.outputs.repository }}
          ref: ${{ steps.renderer.outputs.ref }}
          path: Natives/external/gl4metal
          submodules: recursive

      - name: Apply our 3D image, SSBO and compute changes
        run: python3 scripts/apply_gl4metal_patch.py Natives/external/gl4metal

      - name: Add weak fallback for clear-value function
        run: |
          cd Natives/external/gl4metal/gl4metal
          cat >> texture.mm <<'EOF'

          __attribute__((weak)) bool gl4metalEncodeClearValue(GLenum internalformat, GLenum format, GLenum type, const void *data,
          		uint8_t output[16], size_t &bytes) {
          	size_t sourceBytes = 0;
          	return encodeClearTexel(metalPixelFormat(internalformat), internalformat, format, type, data, output, bytes, sourceBytes);
          }
          EOF

      - name: Fix Makefile rules (lwjgl overlay jar, app icon name)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # JavaApp: skip jar rule for the lwjgl overlay folder
          path = Path('JavaApp/Makefile')
          text = path.read_text()
          marker = 'TARGETS := $(TARGETS:$(SOURCEDIR)/%=$(OUTPUTDIR)/%.jar)\n'
          assert marker in text, 'TARGETS line not found in JavaApp/Makefile'
          extra = 'TARGETS := $(filter-out $(OUTPUTDIR)/lwjgl.jar,$(TARGETS))\n'
          if extra not in text:
              path.write_text(text.replace(marker, marker + extra))
          print('JavaApp/Makefile patched')

          # Root Makefile: use the icon that exists, never fail the build on actool
          path = Path('Makefile')
          text = path.read_text()
          assert '--app-icon AppIcon-Light' in text, 'app icon line not found'
          text = text.replace('--app-icon AppIcon-Light', '--app-icon Chicken')
          old = '--output-partial-info-plist /dev/null || exit 1;'
          assert old in text, 'actool exit line not found'
          text = text.replace(old, "--output-partial-info-plist /dev/null || echo 'actool failed; using precompiled resources';")
          path.write_text(text)
          print('Makefile patched')
          PY

      - name: Checkout launcher dependencies
        run: |
          git submodule update --init --recursive -- \
            Natives/external/AFNetworking Natives/external/DBNumberedSlider \
            Natives/external/fishhook

      - name: Checkout MobileGlues
        uses: actions/checkout@v5
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: main
          path: Natives/external/MobileGlues
          submodules: recursive
          fetch-depth: 0

      - name: Select MobileGlues revision
        run: |
          cd Natives/external/MobileGlues
          if git checkout --detach 0502bdf; then
            echo "Pinned MobileGlues to iOS-era commit 0502bdf"
            git submodule update --init --recursive
          else
            echo "Could not find 0502bdf, staying on main"
          fi
          git log -1 --oneline

      - name: Locate MobileGlues sources
        run: |
          cd Natives/external/MobileGlues
          if [ ! -d src/main/cpp ]; then
            found=$(find . -type d -path '*/src/main/cpp' -not -path './.git/*' | head -n 1)
            mkdir -p src/main
            if [ -n "$found" ]; then
              echo "Found sources at $found"
              ln -s "$PWD/$found" src/main/cpp
            elif [ -f MobileGlues-cpp/CMakeLists.txt ]; then
              echo "Using MobileGlues-cpp directly"
              ln -s "$PWD/MobileGlues-cpp" src/main/cpp
            else
              echo "Could not find MobileGlues sources. Repository layout:"
              find . -maxdepth 3 -not -path './.git/*' | head -n 80
              exit 1
            fi
          fi
          ls src/main/cpp | head -n 30
          ls src/main/cpp/libraries/ios || true

      - name: Make MobileGlues compile on Apple platforms
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('Natives/external/MobileGlues/src/main/cpp').resolve()

          pattern = re.compile(
              r'(?P<head>GLAPI[^;{}]*?\b(?P<name>\w+)\s*\((?P<params>[^;{}]*?)\))'
              r'\s*__attribute__\(\(alias\("(?P<target>\w+)"\)\)\)\s*;', re.S)

          def rewrite(m):
              head, name = m.group('head'), m.group('name')
              params, target = m.group('params').strip(), m.group('target')
              ret = head[:head.rindex(name)]
              args = []
              if params and params != 'void':
                  for p in params.split(','):
                      found = re.search(r'(\w+)\s*(\[[^\]]*\])?\s*$', p.strip())
                      args.append(found.group(1))
              is_void = re.search(r'\bvoid\b', ret) and '*' not in ret
              body = ('' if is_void else 'return ') + target + '(' + ', '.join(args) + ');'
              return head + ' { ' + body + ' }'

          total = 0
          for path in list(root.rglob('*.cpp')) + list(root.rglob('*.c')) + list(root.rglob('*.h')):
              text = path.read_text(errors='ignore')
              new, count = pattern.subn(rewrite, text)
              if count:
                  path.write_text(new)
                  total += count
          print('alias declarations rewritten:', total)

          for path in root.rglob('*'):
              if path.suffix not in ('.h', '.hpp', '.cpp', '.c'):
                  continue
              text = path.read_text(errors='ignore')
              if '__NR_gettid' not in text:
                  continue
              text = re.sub(r'\(int\)\s*syscall\(\s*__NR_gettid\s*\)',
                            '(int)pthread_mach_thread_np(pthread_self())', text)
              if '#include <pthread.h>' not in text:
                  text = '#include <pthread.h>\n' + text
              path.write_text(text)
              print('patched gettid in', path)
          PY

      - name: Install build tools
        run: brew install make ldid wget cmake

      - name: Install Java 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Check launcher bridge
        run: |
          cmake -S tests -B build/bridge-tests
          cmake --build build/bridge-tests
          ctest --test-dir build/bridge-tests --output-on-failure

      - name: Check custom shader translation and Metal shaders
        run: |
          if ! xcrun --sdk iphoneos metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          cmake -S Natives/external/gl4metal -B build/renderer-tests \
            -DGL4METAL_TRANSLATOR_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/renderer-tests --target translator_tests --parallel 3
          ctest --test-dir build/renderer-tests --output-on-failure
          build/renderer-tests/translator_tests build/renderer-tests/msl
          for source in build/renderer-tests/msl/*.metal; do
            standard=ios-metal2.2
            if grep -q 'gl4metal MSL 30100' "$source"; then standard=metal3.1; fi
            xcrun --sdk iphoneos metal -std="$standard" -c "$source" -o "$source.air"
          done

      - name: Build iOS IPA and TrollStore TIPA
        run: |
          set -o pipefail
          status=0
          { gmake -j2 dsym package PLATFORM=2 JOBS=3 SLIMMED=1 BOOTJDK="$JAVA_HOME/bin" && \
            gmake -j2 dsym package PLATFORM=2 JOBS=3 SLIMMED=1 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1; } 2>&1 | tee build.log || status=$?
          echo
          echo "=============== ERRORS ==============="
          grep -E -A40 'Undefined symbols' build.log | head -n 80; grep -E 'error:|fatal error:|ld: |No such file|No rule to make|\*\*\* \[' build.log | sed 's|/Users/runner/work/HynisJE/HynisJE/||' | sort -u | head -n 60 || true
          echo "======================================="
          exit $status

      - name: Record the exact renderer build
        run: |
          cp patches/gl4metal/manifest.json artifacts/gl4metal-build.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('artifacts/gl4metal-build.json')
          manifest = json.loads(path.read_text())
          manifest['hynis_commit'] = os.environ['GITHUB_SHA']
          manifest['library_sha256'] = hashlib.sha256(Path('Natives/build/libgl4metal.dylib').read_bytes()).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Hynis-custom-gl4metal-iOS
          if-no-files-found: error
          path: |
            artifacts/com.congcq.hynis-*-ios.ipa
            artifacts/com.congcq.hynis-*-ios-trollstore.tipa
            artifacts/gl4metal-build.json

      - name: Upload slimmed app
        uses: actions/upload-artifact@v4
        with:
          name: Hynis-custom-gl4metal-iOS-slimmed
          if-no-files-found: error
          path: |
            artifacts/com.congcq.hynis.slimmed-*-ios.ipa
            artifacts/com.congcq.hynis.slimmed-*-ios-trollstore.tipa
            artifacts/gl4metal-build.json

      - name: Upload renderer library
        uses: actions/upload-artifact@v4
        with:
          name: custom-gl4metal-dylib
          if-no-files-found: error
          path: |
            Natives/build/libgl4metal.dylib
            artifacts/gl4metal-build.json

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Hynis.dSYM
          path: artifacts/Hynis.dSYM
