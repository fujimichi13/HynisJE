name: gl4metal bridge checks
on: [push, pull_request]
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - run: |
          cmake -S tests -B build/bridge-tests
          cmake --build build/bridge-tests
          ctest --test-dir build/bridge-tests --output-on-failure
          bash -n scripts/build_gl4metal.sh
      - name: Compile patched LWJGL bridge
        run: |
          mkdir -p build/java
          javac -XDignore.symbol.file \
            -cp "$(find JavaApp/libs/lwjgl-3.3.3 JavaApp/libs/others -name '*.jar' -print | paste -sd: -)" \
            -sourcepath JavaApp/src/lwjgl-3.3.3:JavaApp/src/launcher \
            -d build/java JavaApp/src/lwjgl/org/lwjgl/glfw/GLFW.java
